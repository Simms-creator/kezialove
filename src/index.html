<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 Love Calculator 💖</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .love-calculator-wrapper {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .love-calculator {
            background: linear-gradient(135deg, #ffffff 0%, #fef5f7 100%);
            border-radius: 24px;
            padding: 50px 45px;
            max-width: 480px;
            width: 100%;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.15),
                0 0 1px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
            animation: blobbyMorph 6s ease-in-out infinite;
        }

        @keyframes blobbyMorph {
            0%, 100% {
                border-radius: 24px 24px 24px 24px;
            }
            25% {
                border-radius: 30px 20px 28px 22px;
            }
            50% {
                border-radius: 20px 30px 22px 28px;
            }
            75% {
                border-radius: 28px 22px 20px 30px;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-wrapper label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-wrapper input {
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
            font-family: inherit;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #ff1493;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 20, 147, 0.1);
        }

        .input-wrapper input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .calculate-btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            animation: blobbyPulse 3s ease-in-out infinite;
        }

        @keyframes blobbyPulse {
            0%, 100% {
                border-radius: 50px;
                transform: scale(1);
            }
            25% {
                border-radius: 45% 55% 52% 48% / 48% 45% 55% 52%;
                transform: scale(1.02);
            }
            50% {
                border-radius: 55% 45% 48% 52% / 52% 48% 45% 55%;
                transform: scale(1.04);
            }
            75% {
                border-radius: 48% 52% 45% 55% / 55% 52% 48% 45%;
                transform: scale(1.02);
            }
        }

        .calculate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 20, 147, 0.4);
            animation: blobbyPulse 1.5s ease-in-out infinite;
        }

        .calculate-btn:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
            animation: none;
        }

        .calculate-btn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-section {
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .score-display {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, rgba(255, 20, 147, 0.08) 0%, rgba(255, 105, 180, 0.08) 100%);
            border-radius: 16px;
            border: 2px solid rgba(255, 20, 147, 0.2);
        }

        .percentage {
            font-size: 72px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 16px;
        }

        .message {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            font-size: 14px;
            padding: 12px;
            background: rgba(231, 76, 60, 0.1);
            border-radius: 8px;
            margin-top: 16px;
        }

        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .floating-heart {
            position: absolute;
            bottom: 0;
            animation: float forwards linear;
            user-select: none;
        }

        @keyframes float {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(1.2) rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .love-calculator {
                padding: 40px 25px;
            }

            .header h1 {
                font-size: 28px;
            }

            .percentage {
                font-size: 56px;
            }

            .message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        function LoveCalculator() {
            const [name1, setName1] = useState('');
            const [name2, setName2] = useState('');
            const [score, setScore] = useState(null);
            const [loading, setLoading] = useState(false);
            const [hearts, setHearts] = useState([]);
            const heartIdRef = useRef(0);

            const getCharSum = (str) => {
                let sum = 0;
                for (let i = 0; i < str.length; i++) {
                    sum += str.charCodeAt(i);
                }
                return sum;
            };

            const createHeartFirework = (count) => {
                const newHearts = [];
                const colors = ['#ff1493', '#ff69b4', '#ff85b8', '#ffb6c1', '#ff6f91'];
                
                for (let i = 0; i < count; i++) {
                    const id = heartIdRef.current++;
                    newHearts.push({
                        id,
                        left: Math.random() * 100,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: 15 + Math.random() * 35,
                        duration: 1.5 + Math.random() * 0.5,
                    });
                }
                
                setHearts((prev) => [...prev, ...newHearts]);
                
                setTimeout(() => {
                    setHearts((prev) =>
                        prev.filter((h) => !newHearts.some((nh) => nh.id === h.id))
                    );
                }, 2500);
            };

            const handleCalculate = () => {
                const trimmed1 = name1.trim().toLowerCase();
                const trimmed2 = name2.trim().toLowerCase();

                if (!trimmed1 || !trimmed2) {
                    setScore({ value: 0, message: 'Please enter both names' });
                    return;
                }

                setLoading(true);
                setScore(null);
                
                setTimeout(() => {
                    const sum1 = getCharSum(trimmed1);
                    const sum2 = getCharSum(trimmed2);
                    const totalNum = sum1 * sum2;
                    const finalScore = totalNum % 100;

                    setScore({ value: finalScore, message: null });
                    setLoading(false);

                    const heartCount = finalScore >= 80 ? 40 : 20;
                    createHeartFirework(heartCount);
                }, 800);
            };

            const getScoreMessage = (score) => {
                if (score >= 90) return "🚀 DESTINY WRITTEN IN THE STARS!";
                if (score >= 80) return "💕 An extraordinary love!";
                if (score >= 70) return "❤️ Strong connection!";
                if (score >= 60) return "💗 Good potential!";
                if (score >= 50) return "💓 There's a spark!";
                if (score >= 40) return "💙 Room to grow...";
                if (score >= 30) return "🤝 Just friends vibe";
                if (score >= 20) return "😅 Maybe not meant to be";
                return "👋 Better as friends!";
            };

            const getScoreColor = (score) => {
                if (score >= 80) return '#ff1493';
                if (score >= 60) return '#ff69b4';
                if (score >= 40) return '#ff85b8';
                return '#ffb6c1';
            };

            return (
                <div className="love-calculator-wrapper">
                    <div className="love-calculator">
                        <div className="header">
                            <h1>💖 Love Calculator 💖</h1>
                            <p className="subtitle">Discover your connection</p>
                        </div>

                        <div className="form">
                            <div className="input-wrapper">
                                <label htmlFor="name1">Person 1</label>
                                <input
                                    id="name1"
                                    type="text"
                                    value={name1}
                                    onChange={(e) => setName1(e.target.value)}
                                    placeholder="Enter their name..."
                                    disabled={loading}
                                />
                            </div>

                            <div className="input-wrapper">
                                <label htmlFor="name2">Person 2</label>
                                <input
                                    id="name2"
                                    type="text"
                                    value={name2}
                                    onChange={(e) => setName2(e.target.value)}
                                    placeholder="Enter their name..."
                                    disabled={loading}
                                />
                            </div>

                            <button onClick={handleCalculate} disabled={loading} className="calculate-btn">
                                {loading ? (
                                    <>
                                        <span className="spinner"></span>
                                        Calculating...
                                    </>
                                ) : (
                                    'Calculate Love'
                                )}
                            </button>
                        </div>

                        {score && (
                            <div className="result-section">
                                <div className="score-display" style={{ color: getScoreColor(score.value) }}>
                                    <div className="percentage">{score.value}%</div>
                                    <div className="message">{getScoreMessage(score.value)}</div>
                                </div>
                            </div>
                        )}

                        {score?.message && (
                            <div className="error-message">{score.message}</div>
                        )}
                    </div>

                    <div className="hearts-container">
                        {hearts.map((heart) => (
                            <div
                                key={heart.id}
                                className="floating-heart"
                                style={{
                                    left: `${heart.left}%`,
                                    color: heart.color,
                                    fontSize: `${heart.size}px`,
                                    animationDuration: `${heart.duration}s`,
                                }}
                            >
                                ❤️
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<LoveCalculator />, document.getElementById('root'));
    </script>
</body>
</html>
