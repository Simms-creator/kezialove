<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Untitled Project</title><meta name="title" content="Untitled Project"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body><!-- Love Calculator Widget with Colorful Heart Fireworks -->
<div class="love-card">
  <h2>💖 Love Calculator 💖</h2>
  <div class="input-group">
    <label for="cnameone">Name of Person 1</label>
    <input type="text" id="cnameone" name="cnameone" placeholder="Enter first name">
  </div>
  <div class="input-group">
    <label for="cnametwo">Name of Person 2</label>
    <input type="text" id="cnametwo" name="cnametwo" placeholder="Enter second name">
  </div>
  <button onclick="calc()">Calculate</button>
  <div id="coutput" class="result"></div>
  <div id="hearts"></div>
  <p class="credit">powered by <a href="https://simms-creator.github.io/innojar-html/" rel="nofollow">innojar coporation</a></p>
</div>

<style>
/* Card Container */
.love-card {
  max-width: 400px;
  margin: 40px auto;
  padding: 25px 30px;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  border-radius: 15px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* Card Title */
.love-card h2 {
  margin-bottom: 20px;
  font-size: 24px;
  color: #fff;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
}

/* Input Groups */
.input-group {
  margin-bottom: 15px;
  text-align: left;
}

.input-group label {
  display: block;
  margin-bottom: 5px;
  color: #fff;
  font-weight: bold;
}

.input-group input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 14px;
}

/* Button */
button {
  padding: 10px 25px;
  background-color: #ff6f91;
  border: none;
  border-radius: 8px;
  color: #fff;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
}

button:hover {
  background-color: #ff3c6e;
}

/* Result Styling */
.result {
  margin-top: 20px;
  font-size: 28px;
  font-weight: bold;
}

/* Hearts */
#hearts {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}

.heart {
  position: absolute;
  opacity: 0.9;
  animation: float 1.5s ease-out forwards;
}

@keyframes float {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
}

/* Credit */
.credit {
  margin-top: 15px;
  font-size: 12px;
  color: #fff;
}
.credit a {
  color: #fff;
  text-decoration: underline;
}
</style>

<script>
/*****************************************
(C) https://www.calculator.net all right reserved.
*****************************************/
function gObj(B){var A;if(document.all){if(typeof B=="string"){return document.all(B)}else{return B.style}}if(document.getElementById){if(typeof B=="string"){return document.getElementById(B)}else{return B.style}}return null}
function showquickmsg(B,A){if(A){B="<font color=red>"+B+"</font>"}gObj("coutput").innerHTML=B}
function trimAll(A){while(A.substring(0,1)==" "){A=A.substring(1,A.length)}while(A.substring(A.length-1,A.length)==" "){A=A.substring(0,A.length-1)}return A}
function getNum(A){outputNum=0;for(i=0;i<A.length;i++){outputNum+=A.charCodeAt(i)}return outputNum}

// Create a single heart with random size and color
function createHeart() {
  var h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "❤️";
  h.style.left = Math.random() * 90 + "%";
  h.style.fontSize = (15 + Math.random()*25) + "px"; // random size 15-40px
  var colors = ["#ff3c6e","#ff6f91","#ffb6c1","#ff1493"];
  h.style.color = colors[Math.floor(Math.random()*colors.length)];
  document.getElementById("hearts").appendChild(h);
  setTimeout(()=>h.remove(),1500);
}

// Create multiple hearts, optionally more for fireworks
function createHearts(num){
  for(let i=0;i<num;i++){
    setTimeout(createHeart,i*50);
  }
}

function calc(){
  showquickmsg("calculating...",true);
  cnameone = trimAll(gObj("cnameone").value);
  cnametwo = trimAll(gObj("cnametwo").value);
  if(cnameone.length<1){ showquickmsg("please provide name one",true); return }
  if(cnametwo.length<1){ showquickmsg("please provide name two",true); return }

  cnameone = cnameone.toLowerCase();
  cnametwo = cnametwo.toLowerCase();
  totalNum = getNum(cnameone)*getNum(cnametwo);
  finalScore = totalNum % 100;
  finalScoreHTML = "<h1><font color=green><b>"+finalScore+"%</b></font></h1>";
  showquickmsg(finalScoreHTML,false);

  // Hearts animation
  if(finalScore >= 80){
    // Fireworks effect: 30 colorful hearts for high love %
    createHearts(30);
  } else {
    // Normal: 15 hearts
    createHearts(15);
  }
};
</script><script src="./script.js"></script></body></html>
